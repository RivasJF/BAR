<div class="flex flex-col gap-2 text-sm text-zinc-200 sm:flex-row sm:gap-6">
  <label class="flex min-w-0 flex-col gap-2">
    <span for="volume">Volumen</span>
    <input
      id="volume"
      min="0"
      type="number"
      [formControl]="volume"
      (input)="setVolumeToNullWhenZero()"
      placeholder="Ej. 1"
      class="h-10 w-full min-w-0 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none sm:w-24"
    >
    @if (volume.invalid && (volume.dirty || volume.touched)) {
      <span class="text-xs text-red-400">{{ validationMessage(volume) }}</span>
    }
  </label>

  <label class="flex min-w-0 flex-col gap-2">
    <span for="copies">Ejemplares</span>
    <input
      id="copies"
      min="1"
      type="number"
      [formControl]="copies"
      placeholder="Ej. 1"
      class="h-10 w-full min-w-0 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none sm:w-24"
    >
    @if (copies.invalid && (copies.dirty || copies.touched)) {
      <span class="text-xs text-red-400">{{ validationMessage(copies) }}</span>
    }
  </label>
</div>
