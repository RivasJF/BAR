<div class="grid grid-cols-1 gap-x-16 gap-y-6 md:grid-cols-2">
  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span>Número de Tarjeta</span>
    <input type="text" class="h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
  </label>

  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span>Título</span>
    <input type="text" class="h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
  </label>

  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span>Signatura Topográfica</span>
    <input type="text" class="h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
  </label>

  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span>Autor</span>
    <input type="text" class="h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
    <span class="self-center text-xs text-zinc-400">◉</span>
  </label>

  <label class="flex flex-col gap-2 text-sm text-zinc-200 md:max-w-xs">
    <span>Categoría</span>
    <select class="h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
      <option>800-Literatura</option>
    </select>
  </label>

  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span>Observaciones</span>
    <textarea rows="2" class="resize-none rounded-md border border-zinc-500 bg-zinc-900 px-3 py-2 text-white outline-none"></textarea>
  </label>

  <div class="flex flex-col gap-2 text-sm text-zinc-200 sm:flex-row sm:gap-10">
    <label class="flex flex-col gap-2">
      <span>Edición</span>
      <input type="number" class="h-11 w-24 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
    </label>

    <label class="flex flex-col gap-2">
      <span>Ejemplares</span>
      <input type="number" class="h-11 w-24 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
    </label>
  </div>

  <div class="flex items-end justify-start md:justify-end">
    <button type="button" class="h-11 w-full rounded-md border border-zinc-400 bg-zinc-800 px-8 text-sm text-zinc-100 sm:w-auto">
      Agregar
    </button>
  </div>
</div>
