<form class="grid grid-cols-1 gap-x-16 gap-y-6 md:grid-cols-2" [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <!-- CardNumber -->
  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span
        htmlFor="cardNumber"
    >Número de Tarjeta</span>
    <input
        id="cardNumber"
        formControlName="cardNumber"
        placeholder="Ej. 497932"
        type="number"
        class="no-spinner h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
    @if (cardNumber.invalid && (cardNumber.dirty || cardNumber.touched)) {
      <span class="text-xs text-red-400">{{ validationMessage(cardNumber) }}</span>
    }
  </label>

  <!-- Title -->
  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span
        htmlFor="title"
    >Título</span>
    <input
        id="title"
        formControlName="title"
        placeholder="Ej. Cien años de soledad"
        type="text"
        class="h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
    @if (title.invalid && (title.dirty || title.touched)) {
      <span class="text-xs text-red-400">{{ validationMessage(title) }}</span>
    }
  </label>

  <!-- CallNumber -->
  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span
        htmlFor="call_number"
    >Signatura Topográfica</span>
    <input
        id="call_number"
        formControlName="callNumber"
        placeholder="Ej. 869.3/S37/E58/2005R1"
        type="text"
        class="h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
    @if (callNumber.invalid && (callNumber.dirty || callNumber.touched)) {
      <span class="text-xs text-red-400">{{ validationMessage(callNumber) }}</span>
    }
  </label>

  <!-- Autors -->
  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span>Autor</span>
    @for (authorControl of author.controls; track $index; let authorIndex = $index) {
      <div formArrayName="author" class="flex items-center gap-2">
        <div class="relative flex w-full flex-col gap-1">
          <input
              type="text"
              [formControlName]="$index"
              [value]="authorControl.value"
              (focus)="activateAuthorSearch(authorIndex)"
              (input)="searchAuthors($event.target.value, authorIndex)"
              placeholder="Ej. Gabriel García Márquez"
              class="h-11 w-full rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
          @if (authorControl.invalid && (authorControl.dirty || authorControl.touched)) {
            <span class="text-xs text-red-400">{{ validationMessage(authorControl) }}</span>
          }
            @if (activeAuthorIndex() === authorIndex && authorControl.value && authorControl.value.length > 0 && filteredAuthors.length > 0) {
                <ul class="absolute left-0 top-full z-10 mt-1 max-h-40 w-full overflow-y-auto rounded-md border border-zinc-500 bg-zinc-900 text-white">
                @for (filteredAuthor of filteredAuthors; track filteredAuthor) {
                    <li
                        (click)="selectAuthor(filteredAuthor, authorIndex)"
                        class="cursor-pointer px-3 py-2 hover:bg-zinc-700">{{ filteredAuthor.name }}</li>
                }
                </ul>
            }
        </div>
        <span
            (click)="removeAuthor($index)"
            [class.invisible]="author.controls.length === 1"
            class="cursor-pointer text-xs text-zinc-400">REMOVE</span>
      </div>
    }
    <span
        (click)="addAuthor()"
        [class.invisible]="author.controls.length === MAX_AUTHORS"
        class="material-symbols-outlined self-center text-xs text-zinc-400">add</span>
  </label>

  <!-- DeweyCategoy -->
  <label class="flex flex-col gap-2 text-sm text-zinc-200 md:max-w-xs">
    <span>Categoría</span>
    <select
        formControlName="deweyCategory"
        class="h-11 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-black outline-none">
            <option [ngValue]="null" >---</option>
        @for(category of categories; track category) {
            <option
                [ngValue]="category.code">{{category.code+'-'+category.name }}</option>
        }
    </select>
  </label>

  <!-- Observations -->
  <label class="flex flex-col gap-2 text-sm text-zinc-200">
    <span
        htmlFor="observations"
    >Observaciones</span>
    <textarea
        id="observations"
        formControlName="observations"
        placeholder="Agrega observaciones del libro"
        rows="2"
        class="resize-none rounded-md border border-zinc-500 bg-zinc-900 px-3 py-2 text-white outline-none"></textarea>
    @if (observations.invalid && (observations.dirty || observations.touched)) {
      <span class="text-xs text-red-400">{{ validationMessage(observations) }}</span>
    }
  </label>

  <!-- Volumen -->
  <div class="flex flex-col gap-2 text-sm text-zinc-200 sm:flex-row sm:gap-10">
    <label class="flex flex-col gap-2">
      <span
            htmlFor="volume"
      >Volumen</span>
      <input
          min="0"
          id="volume"
          formControlName="volume"
          (input)="setVolumeToNullWhenZero()"
          placeholder="Ej. 1"
          type="number" class="h-11 w-24 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
      @if (volume.invalid && (volume.dirty || volume.touched)) {
        <span class="text-xs text-red-400">{{ validationMessage(volume) }}</span>
      }
    </label>

    <!-- Copies -->
    <label class="flex flex-col gap-2">
      <span
          htmlFor="copies"
      >Ejemplares</span>
      <input
          min="1"
         id="copies"
         formControlName="copies"
          placeholder="Ej. 1"
          type="number" class="h-11 w-24 rounded-md border border-zinc-500 bg-zinc-900 px-3 text-white outline-none">
      @if (copies.invalid && (copies.dirty || copies.touched)) {
        <span class="text-xs text-red-400">{{ validationMessage(copies) }}</span>
      }
    </label>
  </div>


  <div class="flex flex-col gap-4 md:justify-end md:items-end">
    @if (error()) {
      <p class="w-full rounded-md border border-red-500 bg-red-900/40 px-3 py-2 text-sm text-red-200 md:w-auto">
        {{ error() }}
      </p>
    }

    @if (success()) {
      <p class="w-full rounded-md border border-emerald-500 bg-emerald-900/40 px-3 py-2 text-sm text-emerald-200 md:w-auto">
        Libro registrado correctamente.
      </p>
    }

    <button
        [disabled]="buttonDisabled() || loading()"
        type="submit"
        class="h-11 w-full cursor-pointer rounded-md border border-zinc-400 bg-zinc-800 px-8 text-sm text-zinc-100 disabled:cursor-not-allowed sm:w-auto">
      {{ loading() ? 'Agregando...' : 'Agregar' }}
    </button>
  </div>
</form>
