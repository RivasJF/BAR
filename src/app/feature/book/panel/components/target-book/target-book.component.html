<article class="flex min-h-48 w-full max-w-sm flex-col rounded-[2rem] border border-zinc-300 bg-zinc-900/90 px-5 py-4 text-zinc-100 shadow-lg">
  <div class="flex justify-end">
    <span class="text-lg font-medium tracking-wide">{{cardNumber()}}</span>
  </div>

  <div class="mt-3 flex flex-col gap-3">
    <h2 class="text-3xl font-medium uppercase tracking-wide">{{title()}}</h2>
    @for(author of authors(); track author.getId()){
            <p class="text-2xl font-medium uppercase tracking-wide">{{author.getName()}}</p>
    }
    <p class="text-xl font-medium">{{callNumber()}}</p>
  </div>
</article>
