<section class="relative h-full w-full flex-1 flex-col overflow-hidden  bg-zinc-900/40 shadow-lg">
    <header class="flex items-center justify-center gap-4 py-2 px-2">
            <panel-search-component class="flex-1 max-w-3xl flex items-center gap-2 justify-center" />
    </header>

        <main class="flex-1 mt-4 border border-zinc-700 rounded-xl bg-zinc-900/40 p-6 relative flex flex-col gap-4 overflow-y-auto">
            <panel-content-component (bookSelected)="onBookSelected($event)" />

        </main>

        @if (selectedBook) {
            <details-book-component
                class="absolute inset-0 z-10 flex items-center justify-center bg-[#222222]/50 backdrop-blur-sm"
                [book]="selectedBook"
                (close)="onCloseDetails()"
            />
        }
</section>
